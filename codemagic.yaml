workflows:
  tendies-editor-unsigned:
    name: TendiesEditor unsigned IPA
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: latest
    scripts:
      - name: Unzip CAPlayground static export
        script: |
          ls -lh caplayground-out.zip
          rm -rf TendiesEditor/caplayground
          unzip -o caplayground-out.zip
          mv out TendiesEditor/caplayground
          test -f TendiesEditor/caplayground/projects.html
          test -f TendiesEditor/caplayground/editor/demo.html
      - name: Build unsigned app
        script: |
          xcodebuild \
            -project TendiesEditor.xcodeproj \
            -scheme TendiesEditor \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build
      - name: Package unsigned IPA
        script: |
          APP_PATH=$(find "$CM_BUILD_DIR/build" "$HOME/Library/Developer/Xcode/DerivedData" -maxdepth 6 -type d -name 'TendiesEditor.app' 2>/dev/null | head -n 1)
          echo "Found app: $APP_PATH"
          test -n "$APP_PATH"
          rm -rf Payload TendiesEditor-unsigned.ipa
          mkdir Payload
          cp -R "$APP_PATH" Payload/
          zip -r TendiesEditor-unsigned.ipa Payload
    artifacts:
      - TendiesEditor-unsigned.ipa
