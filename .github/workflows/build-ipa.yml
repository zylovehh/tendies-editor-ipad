name: 编译未签名 IPA

# 手动触发为主；推到 main 也自动编一次，方便换 index.html 后直接拿新包。
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    # 老 Xcode 版：不用 macos-latest（会解析到 macOS 26 + Xcode 26.6）。
    # 没选 macos-14：该镜像 2026-11-02 退役，2026 年 10 月正处停服窗口期，
    # 容量缩减、排队变长，且 11 月 2 日后任何 GitHub 托管镜像都不再带 Xcode 15，
    # 现在用它编出来的包 4 天后就无法复现。macos-15 是目前仍可用的最老镜像，
    # 其上最老的 Xcode 是 16.0（默认 16.4），SDK 是 iOS 18 时代，比 iOS 26.5 SDK
    # 更接近目标设备 iPadOS 18.7.8。
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 16.0
        run: |
          ls /Applications | grep -i Xcode
          sudo xcode-select -s /Applications/Xcode_16.0.app
          xcodebuild -version

      - name: Show Xcode version
        run: xcodebuild -version

      # 未签名编译：不依赖任何证书 / 描述文件，产出给用户自己签名安装。
      - name: Build for generic iOS device (no signing)
        run: |
          xcodebuild \
            -project TendiesEditor.xcodeproj \
            -scheme TendiesEditor \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      # .app -> Payload/*.app -> zip 成 .ipa（这就是未签名 IPA 的标准结构）。
      - name: Package unsigned IPA
        run: |
          APP_PATH=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit)
          echo "APP_PATH=$APP_PATH"
          test -n "$APP_PATH"
          test -d "$APP_PATH"
          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r TendiesEditor-unsigned.ipa Payload
          ls -lh TendiesEditor-unsigned.ipa
          unzip -l TendiesEditor-unsigned.ipa | head -20

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: TendiesEditor-unsigned-ipa
          path: TendiesEditor-unsigned.ipa
          if-no-files-found: error
